<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>createResizeRowUndoRecord 演示</title>
    <link rel="stylesheet" href="./plugins/css/pluginsCss.css" />
    <link rel="stylesheet" href="./plugins/plugins.css" />
    <link rel="stylesheet" href="./css/luckysheet.css" />
    <link rel="stylesheet" href="./assets/iconfont/iconfont.css" />
    <style>
        #demo-panel {
            position: fixed;
            top: 20px;
            right: 20px;
            background: white;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
            z-index: 9999;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            width: 280px;
            font-family: Arial, sans-serif;
        }
        
        .demo-btn {
            display: block;
            width: 100%;
            margin: 10px 0;
            padding: 10px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        
        .demo-btn:hover {
            background: #0056b3;
        }
        
        .demo-btn:disabled {
            background: #6c757d;
            cursor: not-allowed;
        }
        
        #status {
            margin: 10px 0;
            padding: 8px;
            border-radius: 4px;
            font-size: 13px;
        }
        
        .status-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .status-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .status-info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #b8daff;
        }
        
        h3 {
            margin: 0 0 15px 0;
            color: #333;
            font-size: 16px;
        }
        
        .row-highlight {
            background-color: #ffffcc !important;
        }
    </style>
</head>

<body>
    <div id="luckysheet" style="margin:0px;padding:0px;position:absolute;width:100%;height:100%;left: 0px;top: 0px;"></div>
    
    <!-- 演示控制面板 -->
    <div id="demo-panel">
        <h3>撤销功能演示</h3>
        
        <div id="status" class="status-info">
            准备就绪，点击按钮测试撤销功能
        </div>
        
        <button id="resize-row-6" class="demo-btn">
            设置第6行高度为60px
        </button>
        
        <button id="resize-row-8" class="demo-btn">
            设置第8行高度为100px
        </button>
        
        <button id="reset-rows" class="demo-btn">
            重置所有行高
        </button>
        
        <div style="margin-top: 15px; font-size: 12px; color: #666;">
            <strong>提示：</strong><br>
            • 执行操作后可按 Ctrl+Z 撤销<br>
            • 按 Ctrl+Y 重做操作<br>
            • 第6行和第8行会高亮显示
        </div>
    </div>

    <!-- 引入必要的JS文件 -->
    <script src="./plugins/js/plugin.js"></script>
    <script src="./luckysheet.umd.js"></script>
    
    <script>
        // 等待页面加载完成
        $(function () {
            // 演示数据
            const demoData = [{
                name: "撤销功能演示",
                celldata: [
                    // 添加一些测试数据
                    {r: 0, c: 0, v: {v: "演示数据", ct: {fa: "General", t: "g"}}},
                    {r: 0, c: 1, v: {v: "第2列", ct: {fa: "General", t: "g"}}},
                    {r: 0, c: 2, v: {v: "第3列", ct: {fa: "General", t: "g"}}},
                    {r: 5, c: 0, v: {v: "第6行", ct: {fa: "General", t: "g"}, bg: "#ffffcc"}},
                    {r: 5, c: 1, v: {v: "测试行高调整", ct: {fa: "General", t: "g"}, bg: "#ffffcc"}},
                    {r: 7, c: 0, v: {v: "第8行", ct: {fa: "General", t: "g"}, bg: "#ffffcc"}},
                    {r: 7, c: 1, v: {v: "另一个测试行", ct: {fa: "General", t: "g"}, bg: "#ffffcc"}},
                ],
                config: {},
                index: 0,
                order: 0
            }];

            // 初始化 Luckysheet
            luckysheet.create({
                container: 'luckysheet',
                lang: 'zh',
                data: demoData,
                allowEdit: true,
                hook: {
                    workbookCreateAfter: function() {
                        console.log('=== Luckysheet 初始化完成 ===');
                        updateStatus('初始化完成，可以开始测试撤销功能', 'info');
                        
                        // 检查API是否可用
                        if (typeof luckysheet.createResizeRowUndoRecord === 'function') {
                            updateStatus('createResizeRowUndoRecord API 可用', 'success');
                        } else {
                            updateStatus('警告：createResizeRowUndoRecord API 不可用', 'error');
                            console.warn('createResizeRowUndoRecord 方法未找到');
                        }
                    },
                    // 监听 rangePasteAfter 钩子，演示粘贴后回调
                    rangePasteAfter: function(select, data, txtdata) {
                        updateStatus('触发 rangePasteAfter 钩子，粘贴数据成功', 'success');
                        console.log('rangePasteAfter 触发:', {select, data, txtdata});
                    }
                }
            });

            // 状态更新函数
            function updateStatus(message, type = 'info') {
                const statusEl = document.getElementById('status');
                statusEl.textContent = message;
                statusEl.className = `status-${type}`;
                console.log(`[${type.toUpperCase()}] ${message}`);
            }

            // 第6行高度调整按钮
            document.getElementById('resize-row-6').addEventListener('click', function() {
                if (typeof luckysheet.createResizeRowUndoRecord === 'function') {
                    try {
                        luckysheet.createResizeRowUndoRecord(() => {
                            // 2. 调用 setRowHeight  
                            luckysheet.setRowHeight({1:100,2:100,3:100});  
                                                        
                            updateStatus('第6行高度已设置为60px，可按Ctrl+Z撤销', 'success');
                            return true;
                        });
                    } catch (error) {
                        updateStatus('操作失败：' + error.message, 'error');
                        console.error('调整第6行高度失败:', error);
                    }
                } else {
                    updateStatus('API不可用，直接修改行高', 'error');
                    // 降级处理
                    if (!luckysheet.getLuckysheetfile()[0].config.rowlen) {
                        luckysheet.getLuckysheetfile()[0].config.rowlen = {};
                    }
                    luckysheet.getLuckysheetfile()[0].config.rowlen[5] = 60;
                    luckysheet.refresh();
                }
            });

            // 第8行高度调整按钮
            document.getElementById('resize-row-8').addEventListener('click', function() {
                if (typeof luckysheet.createResizeRowUndoRecord === 'function') {
                    try {
                        luckysheet.createResizeRowUndoRecord(() => {
                            // 设置第8行（索引7）高度为100px
                            if (!luckysheet.getLuckysheetfile()[0].config.rowlen) {
                                luckysheet.getLuckysheetfile()[0].config.rowlen = {};
                            }
                            luckysheet.getLuckysheetfile()[0].config.rowlen[7] = 100;
                            
                            // 刷新表格显示
                            luckysheet.refresh();
                            
                            updateStatus('第8行高度已设置为100px，可按Ctrl+Z撤销', 'success');
                            return true;
                        });
                    } catch (error) {
                        updateStatus('操作失败：' + error.message, 'error');
                        console.error('调整第8行高度失败:', error);
                    }
                } else {
                    updateStatus('API不可用，直接修改行高', 'error');
                    // 降级处理
                    if (!luckysheet.getLuckysheetfile()[0].config.rowlen) {
                        luckysheet.getLuckysheetfile()[0].config.rowlen = {};
                    }
                    luckysheet.getLuckysheetfile()[0].config.rowlen[7] = 100;
                    luckysheet.refresh();
                }
            });

            // 重置按钮
            document.getElementById('reset-rows').addEventListener('click', function() {
                if (typeof luckysheet.createResizeRowUndoRecord === 'function') {
                    try {
                        luckysheet.createResizeRowUndoRecord(() => {
                            // 重置所有行高
                            if (luckysheet.getLuckysheetfile()[0].config.rowlen) {
                                delete luckysheet.getLuckysheetfile()[0].config.rowlen[5];
                                delete luckysheet.getLuckysheetfile()[0].config.rowlen[7];
                            }
                            
                            // 刷新表格显示
                            luckysheet.refresh();
                            
                            updateStatus('所有行高已重置，可按Ctrl+Z撤销', 'success');
                            return true;
                        });
                    } catch (error) {
                        updateStatus('重置失败：' + error.message, 'error');
                        console.error('重置行高失败:', error);
                    }
                } else {
                    updateStatus('API不可用，直接重置行高', 'error');
                    // 降级处理
                    if (luckysheet.getLuckysheetfile()[0].config.rowlen) {
                        delete luckysheet.getLuckysheetfile()[0].config.rowlen[5];
                        delete luckysheet.getLuckysheetfile()[0].config.rowlen[7];
                    }
                    luckysheet.refresh();
                }
            });
        });
    </script>
</body>
</html>
